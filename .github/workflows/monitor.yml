name: tennis-monitor

# 长跑模式：GitHub 免费调度实测一天只肯触发 3~5 次（跟设多少无关），
# 所以改成每次触发后在 job 内部持续轮询最多 5.5 小时（公开仓库分钟数免费），
# 靠 concurrency 队列前后接力，把全天 8:00–21:00 PT 基本盖满。
# 额外在 UTC 14:45 / 15:45 各请求一班，保证早 8 点 PT 放场冲刺时段有人在岗（对冲夏/冬令时）。
on:
  schedule:
    - cron: "17 */2 * * *"
    - cron: "45 14 * * *"
    - cron: "45 15 * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "手动触发时发一条测试推送（验证 secrets→ntfy 通路）"
        type: boolean
        default: false

concurrency:
  group: tennis-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # 跨运行保留去重状态（避免每 5 分钟重复推同一个空场）
      - name: Restore dedup state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: tennis-state-${{ github.run_id }}
          restore-keys: |
            tennis-state-

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_CONTROL_TOPIC: ${{ secrets.NTFY_CONTROL_TOPIC }}
        run: |
          if [ "${{ inputs.send_test }}" = "true" ]; then
            python monitor.py --test
          else
            python monitor.py --ci-loop 19800
          fi

      - name: Save dedup state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: tennis-state-${{ github.run_id }}
