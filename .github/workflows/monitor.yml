name: tennis-monitor

# 长跑模式：GitHub 免费调度实测一天只肯触发 3~5 次（跟设多少无关），
# 所以改成每次触发后在 job 内部持续轮询最多 5.5 小时（公开仓库分钟数免费），
# 靠 concurrency 队列前后接力，把全天 8:00–21:00 PT 基本盖满。
# 额外在 UTC 14:45 / 15:45 各请求一班，保证早 8 点 PT 放场冲刺时段有人在岗（对冲夏/冬令时）。
on:
  schedule:
    - cron: "17 */2 * * *"
    - cron: "45 14 * * *"
    - cron: "45 15 * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "手动触发时发一条测试推送（验证 secrets→ntfy 通路）"
        type: boolean
        default: false

concurrency:
  group: tennis-monitor
  cancel-in-progress: false

# contents: write 是给 keepalive 空提交用的（防 60 天不活跃被 GitHub 自动停用调度）
permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # GitHub 会在仓库 60 天无提交后自动停用 schedule（2026-09-17 就这么死过一次）。
      # 距上次提交 ≥40 天就推一个空提交重置计时器，一劳永逸。
      - name: Keepalive
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "距上次提交 ${days} 天"
          if [ "$days" -ge 40 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: reset 60-day inactivity timer [skip ci]"
            git push
            echo "已推 keepalive 空提交"
          fi

      # 跨运行保留去重状态（避免每 5 分钟重复推同一个空场）
      - name: Restore dedup state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: tennis-state-${{ github.run_id }}
          restore-keys: |
            tennis-state-

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_CONTROL_TOPIC: ${{ secrets.NTFY_CONTROL_TOPIC }}
          NTFY_ALERT_EMAIL: ${{ secrets.NTFY_ALERT_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          if [ "${{ inputs.send_test }}" = "true" ]; then
            python monitor.py --test
          else
            python monitor.py --ci-loop 19800
          fi

      - name: Save dedup state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: tennis-state-${{ github.run_id }}
